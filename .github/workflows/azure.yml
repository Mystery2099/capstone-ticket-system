name: Azure deployment

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'design/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'design/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Package production server
        shell: bash
        run: |
          set -euo pipefail
          pnpm prune --prod
          mkdir release
          tar -czf release/application.tar.gz build node_modules package.json
          cp scripts/azure/start.sh release/start.sh
          cd release
          zip ../release.zip application.tar.gz start.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: azure-release
          path: release.zip
          retention-days: 7

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azure-release
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy existing free web app
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP}"
          : "${APP_NAME:?Set AZURE_WEBAPP_NAME}"
          az webapp deploy --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --src-path release.zip --type zip --output none
          hostname=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --query defaultHostName --output tsv)
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 10 --max-time 30 "https://${hostname}/health"
