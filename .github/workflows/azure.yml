name: Azure container deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Choose immutable image tag
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Record image name
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          echo "Container image (published only on main): $IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy existing app
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
          IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP}"
          : "${APP_NAME:?Set AZURE_CONTAINER_APP}"
          az extension add --name containerapp --upgrade --yes
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --image "$IMAGE" --min-replicas 0 --max-replicas 1 --output none
          hostname=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 10 --max-time 30 "https://${hostname}/health"
