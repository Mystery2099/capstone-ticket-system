<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script nonce="%sveltekit.nonce%">
			// Applies the saved theme before first paint so dark mode users never see a light flash.
			// Keep in sync with src/lib/theme.ts.
			try {
				const theme = localStorage.getItem('ticket-theme');
				const root = document.documentElement;
				const isDark =
					theme === 'light' || theme === 'dark'
						? theme === 'dark'
						: matchMedia('(prefers-color-scheme: dark)').matches;
				root.dataset.theme = isDark ? 'dark' : 'light';
				if (localStorage.getItem('ticket-palette') === 'classic') root.dataset.palette = 'classic';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
